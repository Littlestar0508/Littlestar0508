name: Metrics
on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST 근처(UTC 0시)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) Most Used Language 대체 (languages 카드)
      - name: Metrics - Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Littlestar0508
          template: classic
          base: ""
          filename: metrics.languages.svg
          plugin_languages: yes
          plugin_languages_ignored: "Jupyter Notebook, Python"
          plugin_languages_details: percentage

      # 2) Git Status 대체 (기본 활동/통계 카드)
      - name: Metrics - Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Littlestar0508
          template: classic
          base: header, activity, community
          filename: metrics.stats.svg
